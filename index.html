<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Visualization SDK Demo</title>
    <link rel="stylesheet" href="viz-styles.css">
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
        }
        .chart-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            margin-bottom: 40px;
        }
        .viz-container {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
        }
        #column-chart-container { max-width: 800px; }
        #pie-chart-container { max-width: 500px; }
        #funnel-chart-container { max-width: 700px; margin: auto; }
    </style>
</head>
<body>

    <h1>Custom Visualization SDK Demo</h1>

    <div class="chart-wrapper">
        <div>
            <h2>Stacked Column Chart (Sales by Product)</h2>
            <div id="column-chart-container" class="viz-container"></div>
        </div>
        <div>
            <h2>Pie Chart (Sales by Segment)</h2>
            <div id="pie-chart-container" class="viz-container"></div>
        </div>
    </div>

    <div class="chart-wrapper">
        <div>
            <h2>Funnel Chart (Marketing Funnel)</h2>
            <div id="funnel-chart-container" class="viz-container"></div>
        </div>
        <div>
            <h2>Line Chart (Monthly Revenue)</h2>
            <div id="line-chart-container" class="viz-container"></div>
        </div>
    </div>


    <script src="viz-sdk.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // --- Sample Data for Column and Pie Charts ---
            const salesData = [
              { "Category": "Product A", "Segment": "North", "Sales": 15000 },
              { "Category": "Product B", "Segment": "North", "Sales": 12000 },
              { "Category": "Product A", "Segment": "South", "Sales": 8000 },
              { "Category": "Product B", "Segment": "South", "Sales": 18000 },
              { "Category": "Product C", "Segment": "North", "Sales": 10000 },
              { "Category": "Product A", "Segment": "West", "Sales": 5000 },
              { "Category": "Product C", "Segment": "South", "Sales": 7000 },
              { "Category": "Product B", "Segment": "West", "Sales": 9000 },
              { "Category": "Product C", "Segment": "West", "Sales": 4000 }
            ];

            // --- Sample Data for Funnel Chart ---
            const funnelData = [
                { "Stage": "Website Visits", "Users": 20000 },
                { "Stage": "Downloads", "Users": 9500 },
                { "Stage": "Free Trial", "Users": 4200 },
                { "Stage": "Subscription", "Users": 2100 },
                { "Stage": "Referral", "Users": 750 }
            ];

            // --- Sample Data for Line Chart ---
            const lineData = [
                { "Month": "Jan", "Revenue": 22000 },
                { "Month": "Feb", "Revenue": 24000 },
                { "Month": "Mar", "Revenue": 21000 },
                { "Month": "Apr", "Revenue": 27000 },
                { "Month": "May", "Revenue": 31000 },
                { "Month": "Jun", "Revenue": 29000 }
            ];

            // --- Create Stacked Column Chart ---
            const columnContainer = document.getElementById('column-chart-container');
            const columnOptions = {
                categoryKey: 'Category',
                stackByKey: 'Segment',
                valueKey: 'Sales'
            };
            VizSDK.createChart('StackedColumn', columnContainer, salesData, columnOptions);

            // --- Create Pie Chart ---
            const pieContainer = document.getElementById('pie-chart-container');
            const pieOptions = {
                categoryKey: 'Segment', // Slicing by segment
                valueKey: 'Sales'
            };
            VizSDK.createChart('Pie', pieContainer, salesData, pieOptions);

            // --- Create Funnel Chart ---
            const funnelContainer = document.getElementById('funnel-chart-container');
            const funnelOptions = {
                categoryKey: 'Stage',
                valueKey: 'Users'
            };
            VizSDK.createChart('Funnel', funnelContainer, funnelData, funnelOptions);

            // --- Create Line Chart ---
            const lineContainer = document.getElementById('line-chart-container');
            const lineOptions = {
                xKey: 'Month',
                yKey: 'Revenue'
            };
            VizSDK.createChart('Line', lineContainer, lineData, lineOptions);
        });
    </script>

</body>
</html>
